<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
  </defs>
  <!-- 5-petal sakura flower -->
  <g transform="translate(32,32)">
    <!-- Petals -->
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9"/>
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9" transform="rotate(60)"/>
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9" transform="rotate(120)"/>
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9" transform="rotate(180)"/>
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9" transform="rotate(240)"/>
    <ellipse cx="0" cy="-12" rx="7" ry="12" fill="url(#g)" opacity="0.9" transform="rotate(300)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="-2" cy="-2" r="1.2" fill="#f59e0b"/>
    <circle cx="2" cy="-1" r="1" fill="#f59e0b"/>
    <circle cx="0" cy="2" r="1.1" fill="#f59e0b"/>
  </g>
</svg>
